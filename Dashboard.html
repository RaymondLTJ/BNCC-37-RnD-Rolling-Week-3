<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - BNCC</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard">
      <div class="header">
        <h1>Dashboard BNCC</h1>
        <a href="index.html" class="logout-btn">Logout</a>
      </div>

      <div class="content">
        <div class="welcome">
          <h2 id="welcomeText">Selamat datang!</h2>
          <p>Anda berhasil login ke website BNCC</p>
        </div>

        <div class="cards">
          <div class="card">
            <h3>50</h3>
            <p>Total SAT Point</p>
          </div>
          <div class="card">
            <h3>8</h3>
            <p>Total Comserve</p>
          </div>
          <div class="card">
            <h3>150</h3>
            <p>Jumlah UKM yang kamu ikuti</p>
          </div>
        </div>
      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
